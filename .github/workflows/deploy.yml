name: Проверка и публикация

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Проверка контента
        run: node scripts/validate.mjs

      - uses: actions/setup-python@v5
        if: github.event_name != 'pull_request'
        with:
          python-version: '3.12'

      - name: Кэш озвучки
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: audio
          key: audio-${{ hashFiles('data/**', 'scripts/generate_audio.py') }}
          restore-keys: audio-

      - name: Генерация озвучки
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          pip install edge-tts
          python scripts/generate_audio.py

      - name: Сборка сайта
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site audio
          cp -r index.html manifest.webmanifest sw.js .nojekyll assets data audio _site/
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/" _site/sw.js

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
